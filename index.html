  --bg:#F3F2EF; --panel:#FFFFFF; --txt:#0F1626; --mut:#6B7280; --line:#E6E3DD;
  --ok:#1E8E5A; --ok-l:#E4F4EC; --ko:#C0392B; --ko-l:#FBE9E7; --att:#B7791F; --att-l:#FDF3E1;
  --rb:#2F5E9E; --rb-l:#E6EEF9; --r:14px; --sh:0 1px 3px rgba(15,22,38,.06),0 4px 14px rgba(15,22,38,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--beige-d)}
.hidden{display:none!important}

/* ---------- En-tête ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{flex:none;display:block;width:41px;height:34px}
.auth-logo{width:170px;max-width:60vw;height:auto;display:block}
.logo b{display:block;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.logo small{display:block;font-size:11px;color:var(--beige);letter-spacing:1.5px;text-transform:uppercase}
.top .sp{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--beige);color:var(--navy);font-weight:800;font-size:13px;display:grid;place-items:center}

/* ---------- Mise en page ---------- */
main{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:700}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.main{background:var(--navy);color:#fff}.kpi.main span{color:var(--beige)}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--beige);color:#fff;font-weight:700;border-radius:11px;padding:11px 16px;min-height:44px;transition:background .15s}
.btn:hover{background:var(--beige-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--beige)}
.btn.dark{background:var(--navy)}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.lnk{color:var(--beige-d);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:50%;background:var(--beige);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(15,22,38,.25);display:grid;place-items:center}

/* ---------- Navigation basse ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--mut);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--beige)}
.nb{position:absolute;top:4px;left:calc(50% + 6px);background:var(--ko);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 6px}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px;text-align:left;width:100%}
.ico{flex:none;width:40px;height:40px;border-radius:11px;background:var(--beige-l);display:grid;place-items:center;font-size:19px}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none}
.item .r b{display:block;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;margin-top:3px;white-space:nowrap}
.st-att{background:var(--att-l);color:var(--att)}.st-ok{background:var(--ok-l);color:var(--ok)}
.st-ko{background:var(--ko-l);color:var(--ko)}.st-rb{background:var(--rb-l);color:var(--rb)}
.st-neu{background:#EEF0F3;color:var(--mut)}
.badge.w{white-space:normal;text-align:left;line-height:1.35;padding:3px 10px}
.fld .ia,.seg.ia{border-color:var(--beige)!important;background:#FBF6EC;box-shadow:0 0 0 2px rgba(171,152,122,.25)}
.ia-box ul,.err ul{margin:6px 0 0 18px;font-weight:500}
.scan{text-align:center}.scan img{max-height:300px;max-width:100%;border-radius:10px;display:block;margin:0 auto}
.scan-item{border:1.5px solid var(--beige)}
.ver{text-transform:none;letter-spacing:.5px}
#maj{position:fixed;z-index:80;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top, 0px) + 8px);display:flex;align-items:center;gap:12px;
  background:var(--navy);color:#fff;border:1.5px solid var(--beige);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 8px 24px rgba(15,22,38,.35);
  font-size:14px;width:max-content;max-width:calc(100vw - 32px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.steps{padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
input.mini{width:100%;min-width:58px;border:1.5px solid var(--line);border-radius:8px;padding:7px 6px;font-size:15px;text-align:right}
.num{font-size:12.5px;color:var(--beige-d);font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums;margin-top:2px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty .e{font-size:36px;margin-bottom:6px}
.grp{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .acts .btn{flex:1}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;text-transform:uppercase;vertical-align:bottom;letter-spacing:.6px;color:var(--mut);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Formulaires ---------- */
.f{display:flex;flex-direction:column;gap:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;outline:none}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--beige)}
.fld input[readonly]{background:#F7F6F3;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--beige)}
.fld label.chk{display:flex;margin:0;font-size:14px}
.seg{display:flex;background:#EEEBE5;border-radius:11px;padding:3px}
.seg label{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){background:#fff;box-shadow:var(--sh)}
.help{font-size:12px;color:var(--mut);margin-top:4px}
.err{background:var(--ko-l);color:var(--ko);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.info{background:var(--beige-l);border-radius:10px;padding:10px 12px;font-size:13.5px}
.calc{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px}
.calc b{font-size:22px}.calc small{display:block;color:var(--beige);font-size:12px}
.justif{border:1.5px dashed var(--beige);border-radius:12px;padding:12px;text-align:center}
.justif img{max-width:100%;max-height:240px;border-radius:8px;display:block;margin:0 auto 8px}
.justif .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- Fenêtres modales ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
.ov{position:absolute;inset:0;background:rgba(15,22,38,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:50%;background:#fff;font-size:20px;display:grid;place-items:center;box-shadow:var(--sh)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut);font-weight:600}.kv dd{font-weight:600;text-align:right;word-break:break-word}
.imgfull{max-width:100%;border-radius:10px;display:block;margin:0 auto}

/* ---------- Écrans d'accès ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,#2a2f3a 100%)}
.auth .box{background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.auth .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:22px;color:#fff;text-align:center}
.auth .brand b{font-size:20px;letter-spacing:.4px}.auth .brand small{color:var(--beige);letter-spacing:2px;text-transform:uppercase;font-size:11.5px}
.auth h2{margin-bottom:14px}
.auth .links{display:flex;justify-content:space-between;margin-top:14px;font-size:13.5px;gap:10px;flex-wrap:wrap}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--beige);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Notifications ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.ko{background:var(--ko)}
</style>
</head>

<div id="app"><div class="center"><div><div class="spin"></div>Chargement…</div></div></div>

<script>

const ADMIN_EMAIL = "administration@dreamshomeconcept.com";

  adresse: "5 rue de l'Industrie, 74000 Annecy",
  siret: "938 913 456 00019"
};
const SOCIETE = Object.assign({}, SOCIETE_DEFAUT);
// Valeurs par défaut : société, script Google, email, lecture des tickets, catégories et barème IK
// se règlent ensuite dans l'onglet Paramètres (administrateurs).

<!-- =====================================================================
     2. LOGIQUE MÉTIER (calculs purs, sans interface)
     ===================================================================== -->
<script id="nf-logic">
(function (g) {
  "use strict";
  const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const pad = n => String(n).padStart(2, "0");

  /* ---- Barème kilométrique fiscal voitures ---- */
  const BAREME_IK = {
    libelle: "Barème fiscal 2026 (identique 2025)",
    majorationElectrique: 0.20,
    // [distance max de la tranche, coefficient, forfait]
    voiture: {
      3: [[5000, 0.529, 0], [20000, 0.316, 1065], [Infinity, 0.370, 0]],
      4: [[5000, 0.606, 0], [20000, 0.340, 1330], [Infinity, 0.407, 0]],
      5: [[5000, 0.636, 0], [20000, 0.357, 1395], [Infinity, 0.427, 0]],
      6: [[5000, 0.665, 0], [20000, 0.374, 1457], [Infinity, 0.447, 0]],
      7: [[5000, 0.697, 0], [20000, 0.394, 1515], [Infinity, 0.470, 0]]
    }
  };
  const BAREME_DEFAUT = {
    libelle: "Barème fiscal 2026 (identique 2025)", majorationElectrique: 0.20,
    cv: { 3: { a: 0.529, b: 0.316, c: 1065, e: 0.370 }, 4: { a: 0.606, b: 0.340, c: 1330, e: 0.407 }, 5: { a: 0.636, b: 0.357, c: 1395, e: 0.427 },
      6: { a: 0.665, b: 0.374, c: 1457, e: 0.447 }, 7: { a: 0.697, b: 0.394, c: 1515, e: 0.470 } }
  };
  // Format stocké (sans tableaux imbriqués ni Infinity, compatibles Firestore) -> format de calcul
  function setBareme(b) {
    b = b && b.cv ? b : BAREME_DEFAUT;
    BAREME_IK.libelle = String(b.libelle || BAREME_DEFAUT.libelle);
    BAREME_IK.majorationElectrique = Number(b.majorationElectrique) >= 0 ? Number(b.majorationElectrique) : 0.2;
    [3, 4, 5, 6, 7].forEach(k => {
      const x = b.cv[k] || b.cv[String(k)] || BAREME_DEFAUT.cv[k];
      BAREME_IK.voiture[k] = [[5000, +x.a, 0], [20000, +x.b, +x.c], [Infinity, +x.e, 0]];
    });
  }
  const baremeStocke = () => ({ libelle: BAREME_IK.libelle, majorationElectrique: BAREME_IK.majorationElectrique,
    cv: Object.fromEntries([3, 4, 5, 6, 7].map(k => { const t = BAREME_IK.voiture[k]; return [k, { a: t[0][1], b: t[1][1], c: t[1][2], e: t[2][1] }]; })) });
  /* ---- Versions de l'application ---- */
  function compareVersions(a, b) {
    const x = String(a || "0").split(".").map(n => parseInt(n, 10) || 0), y = String(b || "0").split(".").map(n => parseInt(n, 10) || 0);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; }
    return 0;
  }
  const extraireVersion = html => { const m = String(html || "").match(/APP_VERSION\s*=\s*"(\d+(?:\.\d+){0,3})"/); return m ? m[1] : null; };
  const versionValide = v => /^\d+(\.\d+){0,3}$/.test(String(v || ""));

  const cvCle = cv => { cv = parseInt(cv, 10) || 0; return cv <= 3 ? 3 : cv >= 7 ? 7 : cv; };
  const cvLib = cv => { const k = cvCle(cv); return k === 3 ? "3 CV et moins" : k === 7 ? "7 CV et plus" : k + " CV"; };
  function baremeAnnuel(cv, d, electrique) {
    d = Math.max(0, Number(d) || 0);
    let v = 0;
    for (const [max, a, b] of BAREME_IK.voiture[cvCle(cv)]) { if (d <= max) { v = d * a + b; break; } }
    return electrique ? v * (1 + BAREME_IK.majorationElectrique) : v;
  }
  // Montant d'un trajet = barème(cumul annuel + km) − barème(cumul annuel)
  function montantIK({ cv, electrique, km, cumulAvant = 0 }) {
    km = Math.max(0, Number(km) || 0);
    cumulAvant = Math.max(0, Number(cumulAvant) || 0);
    const total = cumulAvant + km;
    const m = r2(baremeAnnuel(cv, total, electrique) - baremeAnnuel(cv, cumulAvant, electrique));
    return { montant: m, tauxMoyen: km ? m / km : 0, tranche: total <= 5000 ? 1 : total <= 20000 ? 2 : 3 };
  }
  // km déjà parcourus dans l'année (même personne, même véhicule, hors refusés)
  function cumulKmAvant(depenses, owner, vehiculeId, date, excludeId) {
    const an = String(date || "").slice(0, 4);
    return depenses
      .filter(d => d.type === "ik" && d.owner === owner && d.vehiculeId === vehiculeId && d.id !== excludeId &&
        d.statut !== "refusee" && String(d.date).slice(0, 4) === an && d.date <= date)
      .reduce((s, d) => s + (Number(d.kmTotal) || 0), 0);
  }

  /* ---- TVA ---- */
  function calcTVA(ttc, taux) {
    ttc = r2(ttc); taux = Number(taux) || 0;
    const tva = r2(ttc - ttc / (1 + taux / 100));
    return { ttc, tva, ht: r2(ttc - tva) };
  }

  /* ---- Numérotation des notes ---- */
  const slugCode = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase()
    .replace(/[^A-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 20);
  // Code unique d'une personne : NOM, ou NOM-P (initiale du prénom) si un homonyme a déjà ce code
  function codePersonne(u, users) {
    const moi = u.id || u.email;
    const nom = slugCode(u.nom) || slugCode(String(moi || "").split("@")[0]) || "X";
    const pris = new Set((users || []).filter(x => (x.id || x.email) !== moi).map(x => x.code || slugCode(x.nom)));
    if (!pris.has(nom)) return nom;
    const ini = slugCode(u.prenom).slice(0, 1);
    let c = ini ? nom + "-" + ini : nom + "-2", k = 2;
    while (pris.has(c)) c = nom + "-" + ini + (k++);
    return c;
  }
  const numeroNote = (code, mois, complement) => "NDF-" + mois + "-" + (code || "X") + (complement ? "-C" + complement : "");

  /* ---- Envois par email ---- */
  const memeNote = (e, owner, mois) => e.owner === owner && e.mois === mois;
  function etatEnvoi(depenses, envois, owner, mois) {
    const E = envois.filter(e => memeNote(e, owner, mois));
    const ok = E.filter(e => e.statut === "envoye");
    const dejaEnv = new Set(ok.flatMap(e => e.ids || []));
    const L = depenses.filter(d => d.owner === owner && d.mois === mois);
    return {
      attente: L.filter(d => d.statut === "soumise").length,
      ids: L.filter(d => (d.statut === "validee" || d.statut === "remboursee") && !dejaEnv.has(d.id)).map(d => d.id),

/* ---------- Contrôle de version ---------- */
const MAJ = { dispo: null, dernier: 0, enCours: false };
const cleEssai = v => "nf_maj_" + v;
function lireSession(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ecrireSession(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
function recharger(v) {
  ecrireSession(cleEssai(v), String(Date.now()));
  const u = new URL(location.href); u.searchParams.delete("vcheck"); u.searchParams.set("v", v);
  location.replace(u.toString()); // nouvelle adresse : contourne le cache du navigateur et de GitHub
}
// Relit l'index.html publié et compare son numéro de version avec celui qui tourne
async function verifierVersion(force) {
  if (!/^https?:$/.test(location.protocol) || MAJ.enCours) return;
  if (!force && Date.now() - MAJ.dernier < 60e3) return;
  MAJ.dernier = Date.now(); MAJ.enCours = true;
  try {
    const u = new URL(location.href); u.search = ""; u.hash = ""; u.searchParams.set("vcheck", String(Date.now()));
    const rep = await fetch(u.toString(), { cache: "no-store" });
    if (!rep.ok) return;
    const v = NF.extraireVersion(await rep.text());
    if (v && NF.compareVersions(v, APP_VERSION) > 0) { MAJ.dispo = v; proposerMaj(); }
  } catch (e) { /* hors ligne ou page injoignable : nouvel essai plus tard */ }
  finally { MAJ.enCours = false; }
}
function saisieEnCours() {
  const m = $("#modal");
  if (m && m.classList.contains("on")) return true;
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "file");
}
function proposerMaj() {
  if (!MAJ.dispo) return;
  const essai = +lireSession(cleEssai(MAJ.dispo)) || 0;
  const dejaEssaye = Date.now() - essai < 10 * 60e3; // déjà rechargé pour cette version : mise en ligne pas encore propagée
  if (!saisieEnCours() && !dejaEssaye) { recharger(MAJ.dispo); return; }
  afficherBandeauMaj();
}
function afficherBandeauMaj() {
  let b = document.getElementById("maj");
  if (!MAJ.dispo) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "maj"; b.setAttribute("role", "status"); document.body.appendChild(b); }
  b.innerHTML = `<span>Nouvelle version <b>v${esc(MAJ.dispo)}</b> disponible</span><button class="btn sm" data-act="maj-recharger">Recharger</button>`;
}
function demarrerControleVersion() {
  try { // retire le paramètre de rechargement de l'adresse affichée
    const u = new URL(location.href);
    if (u.searchParams.has("v") || u.searchParams.has("vcheck")) { u.searchParams.delete("v"); u.searchParams.delete("vcheck"); history.replaceState(null, "", u.toString()); }
  } catch (e) { }
  verifierVersion(true);
  setInterval(() => verifierVersion(), 10 * 60e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verifierVersion(); });
  window.addEventListener("focus", () => verifierVersion());
}

/* ---------- Démarrage ---------- */
function configOK() { return FIREBASE_CONFIG.apiKey && !/^A_REMPLIR/.test(FIREBASE_CONFIG.apiKey); }
function init() {
  demarrerControleVersion();
  if (!window.firebase) { S.screen = "erreur"; S.erreur = "Impossible de charger Firebase (connexion internet ?)."; render(); return; }
  if (!configOK()) { S.screen = "config"; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); auth.languageCode = "fr";
  db = firebase.firestore();
  auth.onAuthStateChanged(onAuth);
}
function stopSubs() { S.unsub.forEach(f => { try { f(); } catch (e) { } }); S.unsub = []; }
async function onAuth(u) {
  stopSubs(); fermerModal();
  S.fbUser = u; S.profil = null; S.depenses = []; S.users = []; S.remb = []; S.qonto = null; S.justifCache = {}; S.envois = []; S.scriptStatut = null; vueParametres._charge = false; appliquerConfig(null); ENV_CHARGE.dep = ENV_CHARGE.env = false;
  if (!u) { S.screen = "auth"; S.authView = "login"; render(); return; }
  if (!u.emailVerified) { S.screen = "verify"; render(); return; }
  await chargerProfil();
}
async function chargerProfil() {
  const email = monEmail();
  S.screen = "loading"; render();
  try {
    const ref = db.collection("users").doc(email);
    let snap = await ref.get();
    if (!snap.exists && estSuperAdmin()) {
      await ref.set({ email, prenom: "", nom: "Direction", code: "DIRECTION", role: "admin", actif: true, nomBancaire: "", vehicules: [], createdAt: maintenant() });
      snap = await ref.get();
    }
    if (!snap.exists || (snap.data().actif === false && !estSuperAdmin())) { S.screen = "refuse"; render(); return; }
    S.profil = { id: email, ...snap.data() };
    S.admin = S.profil.role === "admin" || estSuperAdmin();
    S.screen = "app"; S.tab = S.admin ? "valider" : "frais";
    abonner(); render();
  } catch (e) {
    console.error(e);
    if (e.code === "permission-denied") S.screen = "refuse";
    else { S.screen = "erreur"; S.erreur = msgErreur(e); }
    render();
  }
}
function errSub(e) {
  console.error(e);
  if (e && e.code === "permission-denied") { stopSubs(); S.screen = "refuse"; render(); return; }
  toast("Synchronisation : " + msgErreur(e), true);
}
function abonner() {
  const email = S.profil.id;
  S.unsub.push(db.collection("users").doc(email).onSnapshot(s => {
    if (!s.exists || (s.data().actif === false && !estSuperAdmin())) { S.screen = "refuse"; stopSubs(); render(); return; }
    S.profil = { id: email, ...s.data() }; render();
  }, errSub));
  S.unsub.push(db.collection("config").doc("app").onSnapshot(s => {
    appliquerConfig(s.exists ? s.data() : null);
    if (S.bloqueVersion) fermerModal(); else planifierEnvoisAuto();
    render();
  }, errSub));
  let q = db.collection("depenses");
  if (S.admin) { const d = new Date(); d.setMonth(d.getMonth() - 18); d.setDate(1); q = q.where("date", ">=", isoDate(d)); }
  else q = q.where("owner", "==", email);
  S.unsub.push(q.onSnapshot(snap => {
    S.depenses = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));
    if (S.qonto && S.qonto.brut) calculerQonto();
    ENV_CHARGE.dep = true; planifierEnvoisAuto();
    render();
  }, errSub));
  const qEnv = S.admin ? db.collection("envois") : db.collection("envois").where("owner", "==", email);
  S.unsub.push(qEnv.onSnapshot(snap => {
    S.envois = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ENV_CHARGE.env = true; planifierEnvoisAuto();
    render();
  }, errSub));
  if (S.admin) {
    S.unsub.push(db.collection("users").onSnapshot(snap => {
      S.users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => nomDe(a.id).localeCompare(nomDe(b.id)));
      render();
    }, errSub));
    S.unsub.push(db.collection("remboursements").onSnapshot(snap => {
      S.remb = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      if (S.qonto && S.qonto.brut) calculerQonto();
      render();
    }, errSub));
  }
}

/* ---------- Rendu principal ---------- */
function render() {
  const app = $("#app");
  if (S.screen === "loading") { app.innerHTML = `<div class="center"><div><div class="spin"></div>Chargement…</div></div>`; return; }
  if (S.screen === "config") { app.innerHTML = vueConfig(); return; }
  if (S.screen === "erreur") { app.innerHTML = vueAuthCadre(`<h2>Erreur</h2><div class="err">${esc(S.erreur)}</div><button class="btn full mt" data-act="reload">Recharger</button>`); return; }
  if (S.screen === "auth") { app.innerHTML = vueAuth(); return; }
  if (S.screen === "verify") { app.innerHTML = vueVerify(); return; }
  if (S.screen === "refuse") { app.innerHTML = vueRefuse(); return; }
  if (S.screen === "app" && S.bloqueVersion) { app.innerHTML = vueBloqueVersion(); return; }
  const y = window.scrollY;
  app.innerHTML = vueApp();
  window.scrollTo(0, y);
}

/* ---------- Application ---------- */
function onglets() {
  const nbAtt = S.depenses.filter(d => d.statut === "soumise").length;
  return S.admin
    ? [["valider", "À valider", nbAtt], ["notes", "Notes", 0], ["frais", "Mes frais", 0], ["equipe", "Équipe", 0], ["parametres", "Paramètres", 0]]
    : [["frais", "Mes frais", 0], ["profil", "Profil", 0]];
}
function vueApp() {
  const p = S.profil;
  const tabs = onglets();
  let corps = "";
  switch (S.tab) {
    case "valider": corps = vueValider(); break;
    case "notes": corps = vueNotes(); break;
    case "parametres": corps = S.admin ? vueParametres() : vueFrais(); break;
    case "equipe": corps = vueEquipe(); break;
    case "profil": corps = vueProfil(); break;
    default: corps = vueFrais();
  }
  return `
  <header class="top">
    <div class="logo">${LOGO}<div><b>${esc(SOCIETE.nom)}</b><small>Frais · <span class="ver">v${APP_VERSION}</span></small></div></div>
    <div class="sp"></div>
    <button class="avatar" data-act="tab" data-tab="profil" title="Mon profil">${esc(initiales(p))}</button>
  </header>
  <main>${corps}</main>
  ${S.tab === "frais" ? `<button class="fab" data-act="nouveau" aria-label="Ajouter">+</button>` : ""}
  <nav class="nav">${tabs.map(([id, lib, n]) =>
    `<button class="${S.tab === id ? "on" : ""}" data-act="tab" data-tab="${id}">${I[id]}${esc(lib)}${n ? `<span class="nb">${n}</span>` : ""}</button>`).join("")}</nav>`;
}

/* ---- Liste d'une dépense ---- */
function ligneDepense(d, avecNom) {
  const c = NF.categorie(d.type === "ik" ? "ik" : d.categorie);
  const titre = d.type === "ik" ? `${d.depart || "?"} → ${d.arrivee || "?"}` : (d.description || c.lib);
  const sous = [dateFr(d.date), etranger(d) ? devFmt(d.montantDevise, d.devise) : null, avecNom ? nomDe(d.owner) : (d.type === "ik" ? `${d.kmTotal} km` : c.lib), d.chantier].filter(Boolean).join(" · ");
  return `<button class="item" data-act="detail" data-id="${esc(d.id)}">
    <div class="ico">${esc(c.ico)}</div>
    <div class="mid"><div class="t">${esc(titre)}</div><div class="s">${esc(sous)}${d.justif ? " · 📎" : ""}</div></div>
    <div class="r"><b>${eur(d.montant)}</b>${badge(d.statut)}</div></button>`;
}

/* ---- Onglet Mes frais ---- */
function vueFrais() {
  const me = S.profil.id;
  const R = NF.recapMois(S.depenses, me, S.mois);
  const liste = R.lignes.slice().reverse();
  return `
  <div class="rowb"><div><h2>Mes frais</h2>${R.tot.n ? `<div class="num">N° ${esc(numeroDe(me, S.mois))}</div>` : ""}</div><div class="fld"><input type="month" data-ch="mois" value="${esc(S.mois)}" aria-label="Mois"></div></div>
  ${R.tot.n ? `<div class="mt">${infoEnvoi(me, S.mois).html}</div>` : ""}
  <div class="kpis mt">
    <div class="kpi main"><span>Total ${esc(libMois(S.mois))}</span><b>${eur(R.tot.total)}</b></div>
    <div class="kpi"><span>En attente</span><b>${eur(R.tot.attente)}</b></div>
    <div class="kpi"><span>Validé à rembourser</span><b>${eur(R.tot.valide)}</b></div>
    <div class="kpi"><span>Remboursé</span><b>${eur(R.tot.rembourse)}</b></div>
  </div>
  ${R.tot.n ? `<div class="mt"><button class="btn sec full" data-act="pdf" data-owner="${esc(me)}" data-mois="${esc(S.mois)}">📄 Télécharger ma note du mois (PDF)</button></div>` : ""}
  <div class="list mt">${liste.length ? liste.map(d => ligneDepense(d)).join("") :
    `<div class="empty"><div class="e">🧾</div>Aucune dépense en ${esc(libMois(S.mois))}.<br>Appuie sur <b>+</b> pour en ajouter une.</div>`}</div>`;
}

/* ---- État d'envoi d'une note ---- */
const moisSuivant = m => { const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const envoiActif = e => e && e.statut === "en_cours" && Date.now() - Date.parse(e.majLe || 0) < 5 * 60e3;
function infoEnvoi(owner, mois) {
  const E = NF.etatEnvoi(S.depenses, S.envois, owner, mois);
  const b = []; let bouton = "";
  E.envoyes.forEach(e => b.push(`<span class="badge w st-rb">✉ ${esc(e.numero)} envoyée le ${dateFr(e.envoyeLe)}</span>`));
  const bl = E.bloque;
  if (scriptUrl()) {
    if (envoiActif(bl)) b.push(`<span class="badge w st-att">Envoi en cours…</span>`);
    else if (bl) {
      b.push(`<span class="badge w st-ko">Échec d'envoi : ${esc(String(bl.erreur || "interrompu").slice(0, 80))}</span>`);
      if (E.ids.length && !E.attente) bouton = "Réessayer l'envoi";
    } else if (E.ids.length) {
      if (E.attente) b.push(`<span class="badge w st-neu">Envoi par email dès que les ${E.attente} ligne(s) en attente seront traitées</span>`);
      else {
        b.push(`<span class="badge w st-neu">${!S.config.envoi.auto ? "Prête à envoyer (envoi automatique désactivé)" : mois < aujourdhui().slice(0, 7) ? "Envoi automatique en cours de préparation" : "Envoi automatique début " + libMois(moisSuivant(mois)).toLowerCase()}</span>`);
        bouton = E.seq ? `Envoyer le complément C${E.seq} maintenant` : "Envoyer maintenant";
      }
    }
  }
  if (!S.admin) bouton = "";
  return { html: b.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${b.join("")}</div>` : "", bouton, E };
}
const ENV_CHARGE = { dep: false, env: false };
const ENVOIS_EN_COURS = new Set();
let _autoTimer = null;
// Envoi automatique : mois terminé, aucune ligne en attente, lignes validées pas encore envoyées
function planifierEnvoisAuto() {
  if (!S.admin || S.bloqueVersion || !scriptUrl() || !S.config.envoi.auto || !ENV_CHARGE.dep || !ENV_CHARGE.env) return;
  clearTimeout(_autoTimer);
  _autoTimer = setTimeout(async () => {
    const L = NF.notesAEnvoyerAuto(S.depenses, S.envois, aujourdhui().slice(0, 7));
    for (const n of L) await envoyerNote(n.owner, n.mois, true);
  }, 1500);
}
const cleEnvoi = (owner, mois, seq) => "env_" + encodeURIComponent(owner).replace(/\./g, "%2E") + "_" + mois + "_" + seq;
async function envoyerNote(owner, mois, auto) {
  const cle = owner + "|" + mois;
  if (ENVOIS_EN_COURS.has(cle)) return false;
  const E = NF.etatEnvoi(S.depenses, S.envois, owner, mois);
  if (!E.ids.length || E.attente || envoiActif(E.bloque)) return false;
  if (!scriptUrl()) { if (!auto) toast("Envoi par email non configuré (Paramètres).", true); return false; }
  ENVOIS_EN_COURS.add(cle);
  const seq = E.seq, numero = numeroDe(owner, mois, seq), ids = E.ids.slice();
  const montant = r2(S.depenses.filter(d => ids.includes(d.id)).reduce((t, d) => t + (+d.montant || 0), 0));
  const ref = db.collection("envois").doc(cleEnvoi(owner, mois, seq));
  const cc = S.config.envoi.cc ? owner : "";
  const base = { owner, mois, seq, numero, ids, montant, destinataire: S.config.envoi.destinataire, cc, auto: !!auto, par: S.profil.id };
  try {
    // Réservation de l'envoi : empêche un double envoi (deux onglets ou deux administrateurs)
    await db.runTransaction(async t => {
      const x = await t.get(ref);
      if (x.exists && (x.data().statut === "envoye" || envoiActif(x.data()))) throw Object.assign(new Error("Envoi déjà effectué ou en cours"), { code: "deja" });
      t.set(ref, Object.assign({}, base, { statut: "en_cours", majLe: maintenant(), erreur: null }));
    });
  } catch (e) { ENVOIS_EN_COURS.delete(cle); if (!auto && e.code !== "deja") toast(msgErreur(e), true); return false; }
  try {
    const pdf = await genererPDF(owner, mois, { ids, seq, sortie: "base64" });
    await appelScript("envoi", { numero, owner, nom: nomDe(owner), mois, periode: libMois(mois), complement: seq,
      montant: eurPdf(montant), nbLignes: ids.length, cc, pdf: pdf.base64, nomFichier: pdf.nomFichier }, 120000);
    await ref.update({ statut: "envoye", envoyeLe: maintenant(), majLe: maintenant(), erreur: null });
    toast(`${numero} envoyée par email ✓`);
    return true;
  } catch (e) {
    console.error(e);
    await ref.update({ statut: "erreur", erreur: String(e.message || e).slice(0, 300), majLe: maintenant() }).catch(() => { });
    toast(`Échec de l'envoi ${numero} : ${e.message || e}`, true);
    return false;
  } finally { ENVOIS_EN_COURS.delete(cle); }
}

/* ---- Scan d'un ticket par Claude ---- */
async function imagePourLecture(file) {
  const img = await chargerImage(await lireFichier(file));
  const k = Math.min(1, 1568 / Math.max(img.width, img.height)); // taille maximale utile pour Claude
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
let _scanId = 0;
async function scannerTicket(file) {
  const id = ++_scanId;
  ouvrirModal("Lecture du ticket", `<div class="scan"><div id="scan-apercu"><div class="spin"></div></div><p class="mt"><b>Claude lit le ticket…</b><br><span class="mut">quelques secondes</span></p></div>`);
  let justif;
  try {
    justif = await preparerJustif(file);
    const a = $("#scan-apercu"); if (a) a.innerHTML = `<img src="${esc(justif.data)}" alt="Ticket photographié">`;
  } catch (e) { fermerModal(); toast(e.message, true); return; }
  let pre;
  try {
    const image = await imagePourLecture(file);
    const r = await appelScript("lire-ticket", { image, mime: "image/jpeg", categories: NF.categoriesVisibles().map(c => ({ id: c.id, lib: c.lib })) }, 45000);
    const n = NF.normaliserTicket(r.ticket, { aujourdhui: aujourdhui() });
    pre = { valeurs: n.v, champs: n.champs, alertes: n.alertes, justif, ia: true };
  } catch (e) {
    pre = { valeurs: {}, champs: [], alertes: ["Lecture impossible : " + e.message + ". Complète le formulaire à la main."], justif, ia: false };
  }
  if (id !== _scanId || !$("#modal").classList.contains("on") || !$("#scan-apercu")) return; // fenêtre fermée entre-temps
  modalFrais(null, pre);
}

/* ---- Justificatif : compression ---- */
function lireFichier(file) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsDataURL(file); });
}
function chargerImage(src) {
  return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("Image illisible")); i.src = src; });
}
async function compresserImage(file) {
  const img = await chargerImage(await lireFichier(file));
  const MAX_CHARS = 380000; // ~ 280 Ko
  for (const [side, q] of [[1600, 0.78], [1400, 0.7], [1200, 0.62], [1000, 0.55], [900, 0.48], [800, 0.42]]) {
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", q);
    if (url.length <= MAX_CHARS || side === 800) return { data: url, mime: "image/jpeg", nom: (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg" };
  }
}
async function preparerJustif(file) {
  if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name || "")) {
    if (file.size > 650 * 1024) throw new Error("PDF trop lourd (650 Ko max). Prends plutôt une photo du document.");
    const data = (await lireFichier(file)).replace(/^data:[^;,]*;/, "data:application/pdf;");
    return { data, mime: "application/pdf", nom: file.name || "justificatif.pdf" };
  }
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|heic|heif|webp)$/i.test(file.name || "")) throw new Error("Format non pris en charge (photo ou PDF).");
  return compresserImage(file);
}
async function chargerJustif(id) {
  if (S.justifCache[id]) return S.justifCache[id];
  const s = await db.collection("justifs").doc(id).get();
  if (!s.exists) return null;
  S.justifCache[id] = s.data();
  return S.justifCache[id];
}
function blocJustif(j) {
  if (!j) return `<div class="mut mb">Aucun justificatif</div>`;
  if (j.mime === "application/pdf") return `<div class="mb">📄 <b>${esc(j.nom || "Justificatif PDF")}</b></div>`;
  return `<img src="${esc(j.data)}" alt="Justificatif">`;
}

      }
      const tva = NF.parseMontant(f.tva.value);
      $("#f-ht", m).textContent = isNaN(ttc) ? "Montant HT : —" : "Montant HT : " + eur(r2(ttc - (isNaN(tva) ? 0 : tva)));
    };
    f.categorie.addEventListener("change", () => { const c = NF.categorie(f.categorie.value); f.tauxTva.value = String(c.tva); st.tvaManuelle = false; majCalc(); });
    f.ttc.addEventListener("input", majCalc);
    f.montantDevise.addEventListener("input", majCalc);
    f.devise.addEventListener("change", () => { if (f.devise.value === "EUR") f.tauxTva.value = String(NF.categorie(f.categorie.value).tva); st.tvaManuelle = false; majCalc(); });
    f.tauxTva.addEventListener("change", () => { st.tvaManuelle = false; majCalc(); });
    f.tva.addEventListener("input", () => { st.tvaManuelle = true; majCalc(); });
    f.sansJustif.addEventListener("change", majCalc);
    const apercu = j => { $("#apercu-justif", m).innerHTML = blocJustif(j); $("#btn-suppr-justif", m).classList.toggle("hidden", !j); };
    $$("[data-justif]", m).forEach(inp => inp.addEventListener("change", async () => {
      const file = inp.files && inp.files[0]; inp.value = ""; if (!file) return;
      $("#apercu-justif", m).innerHTML = `<div class="spin"></div>`;
      try { st.justif = await preparerJustif(file); apercu(st.justif); f.sansJustif.checked = false; majCalc(); }
      catch (e) { apercu(null); st.justif = undefined; $("#f-err", m).innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    }));
    $("#btn-suppr-justif", m).addEventListener("click", () => { st.justif = null; apercu(null); });
    if (existant && existant.justif) chargerJustif(existant.id).then(j => { if (st.justif === undefined) apercu(j); }).catch(() => apercu(null));
    if (pre) {
      (pre.champs || []).forEach(n => {
        const el = f.elements[n]; if (!el) return;
        const cible = el instanceof RadioNodeList ? el[0].closest(".seg") : el;
        if (!cible) return;
        cible.classList.add("ia");
        const off = () => cible.classList.remove("ia");
        (el instanceof RadioNodeList ? Array.from(el) : [el]).forEach(x => { x.addEventListener("input", off); x.addEventListener("change", off); });
      });
    }
    majCalc();
    if (pre && pre.valeurs.devise && pre.valeurs.devise !== "EUR") setTimeout(() => f.ttc.focus(), 250);
    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const errs = [];
      const ttc = NF.parseMontant(f.ttc.value), tva = NF.parseMontant(f.tva.value || "0");
      if (!f.date.value) errs.push("la date");
      if (f.date.value > aujourdhui()) errs.push("une date qui n'est pas dans le futur");
      if (!f.description.value.trim()) errs.push("une description");
      const etr = f.devise.value !== "EUR", mdev = NF.parseMontant(f.montantDevise.value);
      if (etr && (isNaN(mdev) || mdev <= 0)) errs.push("le montant en " + f.devise.value);
      if (isNaN(ttc) || ttc <= 0) errs.push(etr ? "le montant débité en euros" : "un montant TTC valide");
      if (isNaN(tva) || tva < 0 || (!isNaN(ttc) && tva >= ttc)) errs.push("une TVA valide (inférieure au TTC)");
      if (!aJustif() && !f.sansJustif.checked) errs.push("un justificatif (ou coche « Pas de justificatif »)");
      if (errs.length) { $("#f-err", m).innerHTML = `<div class="err">Merci d'indiquer ${esc(errs.join(", "))}.</div>`; return; }
      const sans = f.sansJustif.checked, sansTva = sans || etr;

      const data = {
        type: "frais", date: f.date.value, mois: f.date.value.slice(0, 7), categorie: f.categorie.value,
        description: f.description.value.trim(), chantier: f.chantier.value.trim(), paiement: f.paiement.value,
        ttc: TTC, tva: TVA, ht: r2(TTC - TVA), tauxTva: sansTva ? 0 : +f.tauxTva.value, tvaManuelle: !!st.tvaManuelle,
        devise: f.devise.value, montantDevise: etr ? r2(mdev) : null, tauxChange: etr ? Math.round(NF.tauxChange(mdev, TTC) * 1e6) / 1e6 : null,
        montant: TTC, sansJustificatif: sans
      };
      const btn = $("#btn-save", m); btn.disabled = true; btn.textContent = "Enregistrement…";
      try { await enregistrerDepense(existant, data, sans ? null : st.justif); fermerModal(); toast(existant ? "Dépense mise à jour" : "Dépense soumise ✓"); }
      catch (e) { console.error(e); btn.disabled = false; btn.textContent = "Réessayer"; $("#f-err", m).innerHTML = `<div class="err">${esc(msgErreur(e))}</div>`; }
    });
  });
}

/* ---- Enregistrement (Firestore) ---- */
async function enregistrerDepense(existant, data, justif) {
  const batch = db.batch();
  const ref = existant ? db.collection("depenses").doc(existant.id) : db.collection("depenses").doc();
  const owner = existant ? existant.owner : S.profil.id;
  const doc = Object.assign({}, existant || {}, data, {
    owner, ownerNom: nomDe(owner), statut: "soumise", motifRefus: null, valideLe: null, validePar: null, updatedAt: maintenant()
  });
  delete doc.id;
  if (!existant) doc.createdAt = maintenant();
  if (justif) {
    doc.justif = { mime: justif.mime, nom: justif.nom };
    batch.set(db.collection("justifs").doc(ref.id), { owner, data: justif.data, mime: justif.mime, nom: justif.nom, createdAt: maintenant() });
    S.justifCache[ref.id] = justif;
  } else if (justif === null && existant && existant.justif) {
    doc.justif = null;
    batch.delete(db.collection("justifs").doc(ref.id));
    delete S.justifCache[ref.id];
  } else if (justif === null) doc.justif = null;
  batch.set(ref, doc);
  await batch.commit();
}
async function supprimerDepense(d) {
  const b = db.batch();
  if (d.justif) b.delete(db.collection("justifs").doc(d.id));
  b.delete(db.collection("depenses").doc(d.id));
  await b.commit();
  delete S.justifCache[d.id];
}

function ouvrirJustif(id) {
  const j = S.justifCache[id]; if (!j) return;
  const bytes = atob(j.data.split(",")[1]); const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  const mime = j.mime === "application/pdf" ? "application/pdf" : "image/jpeg";
  const url = URL.createObjectURL(new Blob([arr], { type: mime }));
  const w = window.open(url, "_blank");
  if (!w) { const a = document.createElement("a"); a.href = url; a.download = j.nom || "justificatif"; a.click(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function enregistrerRemboursement(r, batchExterne) {
  const batch = batchExterne || db.batch();
  const ref = r.txKey ? db.collection("remboursements").doc(cleDoc(r.txKey)) : db.collection("remboursements").doc();
  const info = { id: ref.id, date: r.date, montant: r.montant, source: r.source, mode: r.mode || "Virement", reference: r.reference || "", contrepartie: r.contrepartie || "" };
  r.ids.forEach(id => batch.update(db.collection("depenses").doc(id), { statut: "remboursee", remboursement: info, updatedAt: maintenant() }));
  batch.set(ref, { owner: r.owner, mois: r.mois, ids: r.ids, montant: r.montant, date: r.date, source: r.source, mode: r.mode || "Virement",
    reference: r.reference || "", contrepartie: r.contrepartie || "", txKey: r.txKey || null, par: S.profil.id, createdAt: maintenant() });
  if (!batchExterne) await batch.commit();
}
const cleDoc = k => "tx_" + encodeURIComponent(k).replace(/\./g, "%2E").slice(0, 600);
async function annulerRemboursement(id) {
  const h = S.remb.find(x => x.id === id); if (!h) return;
  const batch = db.batch();
  (h.ids || []).forEach(did => {
    const d = S.depenses.find(x => x.id === did);
    if (d && d.statut === "remboursee") batch.update(db.collection("depenses").doc(did), { statut: "validee", remboursement: null, updatedAt: maintenant() });
  });
  batch.delete(db.collection("remboursements").doc(id));
  await batch.commit();
  toast("Remboursement annulé");
}

/* ---- Import Qonto ---- */
function calculerQonto() {
  const Q = S.qonto;
  Q.lecture = NF.lireTransactions(Q.brut, Q.mapping);
  if (Q.lecture.erreur) { Q.propositions = []; Q.stats = {}; return; }
  const deja = new Set(S.remb.map(h => h.txKey).filter(Boolean));
  const { propositions, stats } = NF.proposerRapprochements(Q.lecture.transactions, S.depenses, S.users, deja);
  // conserve les choix manuels si la transaction est toujours proposée
  const anciens = {}; (Q.propositions || []).forEach((p, i) => { anciens[p.tx.key] = { sel: Q.sel[i], choix: Q.choix[i] }; });
  Q.propositions = propositions; Q.stats = stats; Q.sel = []; Q.choix = [];
  propositions.forEach((p, i) => {
    const a = anciens[p.tx.key];
    if (a && a.choix != null && p.candidats[a.choix]) { Q.sel[i] = a.sel; Q.choix[i] = a.choix; return; }
    const k = p.suggestion ? p.candidats.indexOf(p.suggestion) : -1;
    Q.choix[i] = k >= 0 ? k : null;
    Q.sel[i] = p.confiance === "forte";
  });
}
async function lettrer() {
  const Q = S.qonto; const batch = db.batch(); const utilises = new Set(); let n = 0, conflits = 0;
  Q.propositions.forEach((p, i) => {
    if (!Q.sel[i] || Q.choix[i] == null) return;
    const c = p.candidats[Q.choix[i]];
    const ids = c.ids.filter(id => { const d = S.depenses.find(x => x.id === id); return d && d.statut === "validee"; });
    if (!ids.length || ids.some(id => utilises.has(id))) { conflits++; return; }
    ids.forEach(id => utilises.add(id));
    enregistrerRemboursement({ owner: c.owner, mois: c.mois, ids, montant: p.abs, date: p.tx.date, source: "qonto", mode: "Virement",
      reference: p.tx.reference, contrepartie: p.tx.contrepartie, txKey: p.tx.key }, batch);
    n++;
  });
  if (!n) { toast(conflits ? "Sélection en conflit : une même note est choisie deux fois." : "Rien à lettrer", true); return; }
  await batch.commit();
  toast(`${n} remboursement${n > 1 ? "s" : ""} lettré${n > 1 ? "s" : ""} ✓${conflits ? ` · ${conflits} ignoré(s) (conflit)` : ""}`);
}

/* ---------- PDF ---------- */
async function genererPDF(owner, mois, opts = {}) {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("Module PDF non chargé (connexion ?)", true); return; }
  const sources = opts.ids ? S.depenses.filter(d => opts.ids.includes(d.id)) : S.depenses;
  const R = NF.recapMois(sources, owner, mois);
  if (!R.tot.n) { toast("Aucune dépense ce mois-ci", true); return; }
  const seq = opts.seq || 0, numero = numeroDe(owner, mois, seq);
  if (opts.sortie !== "base64") toast("Génération du PDF…");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 14, NAVY = [15, 22, 38], BEIGE = [171, 152, 122], GRIS = [107, 114, 128];
  const p = profilDe(owner);
  const lib = st => (STATUTS[st] || {}).lib || st;

  // En-tête : logo DHC sur fond blanc
  const LW = 30, LH = LW * 1.03;
  try { doc.addImage(LOGO_PDF, "PNG", M, 8, LW, LH); } catch (e) { }
  const xt = M + LW + 6;
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(12.5);
  doc.text(SOCIETE.nom, xt, 18);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
  doc.text(`${SOCIETE.forme} · ${SOCIETE.adresse}`, xt, 24);
  doc.text(`SIRET ${SOCIETE.siret}`, xt, 29);
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
  doc.text(seq ? "NOTE DE FRAIS · COMPLÉMENT " + seq : "NOTE DE FRAIS", W - M, 19, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(...BEIGE);
  doc.text(libMois(mois), W - M, 26, { align: "right" });
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...NAVY);
  doc.text("N° " + numero, W - M, 33, { align: "right" });
  doc.setDrawColor(...BEIGE); doc.setLineWidth(0.8); doc.line(M, 44, W - M, 44);

  // Bloc déclarant
  let y = 53;
  doc.setTextColor(...NAVY); doc.setFontSize(9.5);
  const info = [["Déclarant", nomDe(owner)], ["Email", owner], ["Période", libMois(mois)], ["Édité le", dateFr(aujourdhui())]];
  info.forEach(([k, v], i) => {
    const x = M + (i % 2) * 92, yy = y + Math.floor(i / 2) * 6;
    doc.setFont("helvetica", "bold"); doc.text(k + " :", x, yy); doc.setFont("helvetica", "normal"); doc.text(String(v), x + 22, yy);
  });
  y += 16;

  const baseTable = {
    theme: "grid", margin: { left: M, right: M },
    styles: { font: "helvetica", fontSize: 8.3, cellPadding: 1.8, lineColor: [226, 222, 214], lineWidth: 0.2, textColor: NAVY },
    headStyles: { fillColor: NAVY, textColor: 255, fontStyle: "bold" },
    alternateRowStyles: { fillColor: [248, 246, 242] },
    didParseCell: h => { if (h.section === "body" && h.row.raw && h.row.raw._refusee) { h.cell.styles.textColor = [160, 160, 160]; h.cell.styles.fontStyle = "italic"; } }
  };
  const titre = t => { doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY); doc.text(t, M, y); y += 2.5; };

  if (R.frais.length) {
    titre("Dépenses");
    const body = R.frais.map(d => { const r = [dateFr(d.date), NF.categorie(d.categorie).lib, (d.description || "") + (d.chantier ? "\nChantier : " + d.chantier : "") + (etranger(d) ? `\n${devFmt(d.montantDevise, d.devise).replace(/[\u202f\u00a0]/g, " ")} (1 ${d.devise} = ${(+d.tauxChange || 0).toFixed(4).replace(".", ",")} €)` : "") + (d.sansJustificatif ? "\n(sans justificatif)" : ""),
      d.paiement === "especes" ? "Espèces" : "Avance", eurPdf(d.ht), eurPdf(d.tva), eurPdf(d.ttc), lib(d.statut)]; r._refusee = d.statut === "refusee"; return r; });
    doc.autoTable(Object.assign({}, baseTable, {
      startY: y, head: [["Date", "Catégorie", "Description", "Paiement", "HT", "TVA", "TTC", "Statut"]], body,
      columnStyles: { 0: { cellWidth: 19 }, 1: { cellWidth: 26 }, 3: { cellWidth: 17 }, 4: { halign: "right", cellWidth: 18 }, 5: { halign: "right", cellWidth: 16 }, 6: { halign: "right", cellWidth: 19 }, 7: { cellWidth: 20 } }
    }));
    y = doc.lastAutoTable.finalY + 8;
  }
  if (R.ik.length) {
    if (y > 250) { doc.addPage(); y = 20; }
    titre("Indemnités kilométriques — " + NF.BAREME_IK.libelle);
    const body = R.ik.map(d => { const r = [dateFr(d.date), `${d.depart} > ${d.arrivee}${d.allerRetour ? " (A/R)" : ""}\n${d.description || ""}${d.chantier ? " · " + d.chantier : ""}`,
      `${d.vehiculeLib}\n${NF.cvLib(d.cv)}${d.electrique ? " élec." : ""}`, String(d.kmTotal), eurPdf(d.montant), lib(d.statut)]; r._refusee = d.statut === "refusee"; return r; });
    doc.autoTable(Object.assign({}, baseTable, {
      startY: y, head: [["Date", "Trajet / motif", "Véhicule", "Km", "Montant", "Statut"]], body,
      columnStyles: { 0: { cellWidth: 19 }, 2: { cellWidth: 34 }, 3: { halign: "right", cellWidth: 13 }, 4: { halign: "right", cellWidth: 21 }, 5: { cellWidth: 20 } }
    }));
    y = doc.lastAutoTable.finalY + 8;
  }

  // Récapitulatif
  if (y > 200) { doc.addPage(); y = 20; }
  const cats = Object.entries(R.parCategorie).map(([k, v]) => [NF.categorie(k).lib, eurPdf(v.ht), eurPdf(v.tva), eurPdf(v.ttc)]);
  if (R.tot.ik) cats.push(["Indemnités kilométriques (" + R.tot.km + " km)", eurPdf(R.tot.ik), eurPdf(0), eurPdf(R.tot.ik)]);
  titre("Récapitulatif (hors lignes refusées)");
  doc.autoTable(Object.assign({}, baseTable, {
    startY: y, head: [["Catégorie", "HT", "TVA", "TTC"]], body: cats,
    foot: [["TOTAL DE LA NOTE", eurPdf(r2(R.tot.fraisHT + R.tot.ik)), eurPdf(R.tot.fraisTVA), eurPdf(R.tot.total)]],
    footStyles: { fillColor: BEIGE, textColor: 255, fontStyle: "bold" },
    columnStyles: { 1: { halign: "right", cellWidth: 28 }, 2: { halign: "right", cellWidth: 26 }, 3: { halign: "right", cellWidth: 30 } }
  }));
  y = doc.lastAutoTable.finalY + 6;
  const lignesSt = [["En attente de validation", R.tot.attente], ["Validé, à rembourser", R.tot.valide], ["Déjà remboursé", R.tot.rembourse]];
  if (R.tot.refuse) lignesSt.push(["Refusé (exclu du total)", R.tot.refuse]);
  doc.autoTable(Object.assign({}, baseTable, {
    startY: y, body: lignesSt.map(([k, v]) => [k, eurPdf(v)]), theme: "plain",
    margin: { left: W - M - 90, right: M }, columnStyles: { 0: { fontStyle: "bold" }, 1: { halign: "right" } }
  }));
  y = doc.lastAutoTable.finalY + 12;

  // Signatures
  if (y > 250) { doc.addPage(); y = 25; }
  doc.setDrawColor(200, 196, 188); doc.setLineWidth(0.3);
  [["Le déclarant", nomDe(owner)], ["Validation — Direction", ""]].forEach(([t, n], i) => {
    const x = M + i * 94;
    doc.roundedRect(x, y, 88, 30, 2, 2);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...NAVY); doc.text(t, x + 4, y + 6);
    doc.setFont("helvetica", "normal"); doc.setTextColor(...GRIS); doc.setFontSize(8); doc.text(n ? n + " — date et signature" : "Date et signature", x + 4, y + 11);
  });

  // Annexes : justificatifs photo
  const avecJ = R.frais.filter(d => d.justif && d.statut !== "refusee");
  if (avecJ.length) {
    let pos = 0;
    for (const d of avecJ) {
      let j = null; try { j = await chargerJustif(d.id); } catch (e) { }
      if (pos % 2 === 0) { doc.addPage(); doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY); doc.text("Annexe — justificatifs", M, 14); }
      const top = pos % 2 === 0 ? 20 : 150, H = 122;
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
      doc.text(`${dateFr(d.date)} · ${d.description || ""} · ${eurPdf(d.ttc)}`.slice(0, 110), M, top + 3);
      if (j && j.mime !== "application/pdf") {
        try {
          const img = await chargerImage(j.data);
          const k = Math.min((W - 2 * M) / img.width, (H - 8) / img.height);
          doc.addImage(j.data, "JPEG", M, top + 6, img.width * k, img.height * k);
        } catch (e) { doc.text("(image illisible)", M, top + 12); }
      } else doc.text(j ? `Justificatif PDF « ${j.nom} » — consultable dans l'application.` : "(justificatif introuvable)", M, top + 12);
      pos++;
    }
  }

  // Pieds de page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...GRIS);
    doc.text(`${SOCIETE.nom} — Note de frais ${numero} — ${nomDe(owner)} — ${libMois(mois)} — application v${APP_VERSION}`, M, 290);
    doc.text(`Page ${i} / ${n}`, W - M, 290, { align: "right" });
  }
  const nomFichier = `${numero}_${nomDe(owner).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_")}.pdf`;
  if (opts.sortie === "base64") return { base64: doc.output("datauristring").split(",")[1], nomFichier };
  doc.save(nomFichier);
  return doc;
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev => {
  const ov = ev.target.closest("[data-ov]");
  if (ov && ev.target === ov) { fermerModal(); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === "A") ev.preventDefault();
  try {
    switch (act) {
      case "fermer": fermerModal(); break;
      case "reload": location.reload(); break;
      case "auth-view": S.authView = el.dataset.v; render(); break;
      case "logout": await auth.signOut(); break;
      case "verif-renvoi":
        await auth.currentUser.sendEmailVerification(); authMsg("Email renvoyé ✓", true); break;
      case "verif-ok":
        await auth.currentUser.reload(); await auth.currentUser.getIdToken(true);
        if (auth.currentUser.emailVerified) { S.fbUser = auth.currentUser; await chargerProfil(); }
        else authMsg("Email pas encore validé. Clique sur le lien reçu puis réessaie.");
        break;
      case "tab": S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
      case "nouveau": modalNouveau(); break;
      case "form-frais": modalFrais(); break;
      case "form-ik": modalIK(); break;
      case "detail": modalDetail(id); break;
      case "modifier": { const d = S.depenses.find(x => x.id === id); if (d) d.type === "ik" ? modalIK(d) : modalFrais(d); break; }
      case "supprimer": {
        const d = S.depenses.find(x => x.id === id);
        if (d && confirm("Supprimer définitivement cette ligne ?")) { await supprimerDepense(d); fermerModal(); toast("Supprimé"); }
        break;
      }
      case "ouvrir-justif": ouvrirJustif(id); break;
      case "valider": await valider([id]); if ($("#modal").classList.contains("on")) fermerModal(); break;
      case "valider-tout": {
        const ids = S.depenses.filter(d => d.statut === "soumise" && d.owner === el.dataset.owner).map(d => d.id);
        if (confirm(`Valider les ${ids.length} dépenses de ${nomDe(el.dataset.owner)} ?`)) await valider(ids);
        break;
      }
      case "refuser": modalRefus(id); break;
      case "remettre-attente":
        await db.collection("depenses").doc(id).update({ statut: "soumise", valideLe: null, validePar: null, updatedAt: maintenant() });
        fermerModal(); toast("Remise en attente"); break;
      case "pdf": await genererPDF(el.dataset.owner, el.dataset.mois); break;
      case "maj-recharger": if (MAJ.dispo) recharger(MAJ.dispo); break;
      case "maj-forcee": recharger(S.config.versionMin || APP_VERSION); break;
      case "p-vmin": modalVersionMin(); break;
      case "p-tab": S.paramTab = el.dataset.t; render(); break;
      case "p-societe": modalSociete(); break;
      case "p-script": modalScript(); break;
      case "p-statut": S.scriptStatut = null; render(); await rafraichirStatut(false); break;
      case "p-cle": modalCle(); break;
      case "p-plafond": modalPlafond(); break;
      case "p-dest": modalDestinataire(); break;
      case "p-cat": modalCategorie(id); break;
      case "p-cat-reset": if (confirm("Rétablir les catégories d'origine ?")) { await sauverConfig({ categories: null }); toast("Catégories rétablies"); } break;
      case "p-bareme": modalBareme(); break;
      case "p-tester-cle": el.disabled = true; try { await appelScript("tester-cle"); toast("Clé valide ✓"); } finally { el.disabled = false; } break;
      case "p-suppr-cle":
        if (confirm("Supprimer la clé ? Le scan des tickets sera désactivé.")) {
          S.scriptStatut = await appelScript("reglages", { supprimerCle: true });
          await sauverConfig({ ocr: Object.assign({}, S.config.ocr, { actif: false }) }); toast("Clé supprimée"); render();
        } break;
      case "p-email-test": el.disabled = true; try { const r = await appelScript("email-test"); toast("Email de test envoyé à " + r.a + " ✓"); } finally { el.disabled = false; } break;
      case "envoyer": el.disabled = true; el.textContent = "Envoi en cours…"; await envoyerNote(el.dataset.owner, el.dataset.mois, false); render(); break;
      case "detail-note": modalDetailNote(el.dataset.owner); break;
      case "rembourse-manuel": modalRembManuel(el.dataset.owner); break;
      case "lettrer": el.disabled = true; await lettrer(); break;
      case "annuler-remb": if (confirm("Annuler ce remboursement ? Les lignes repasseront en « Validée ».")) await annulerRemboursement(id); break;
      case "user-edit": modalUser(id); break;
      case "vehicule-edit": modalVehicule(id); break;
      case "pw-reset": await auth.sendPasswordResetEmail(monEmail()); toast("Email de changement de mot de passe envoyé ✓"); break;
    }
  } catch (e) { console.error(e); toast(msgErreur(e), true); if (act === "lettrer") render(); }
});

  if (el.dataset.ch === "mois" && el.value) { S.mois = el.value; render(); }
  else if (el.dataset.ch === "moisAdmin" && el.value) { S.moisAdmin = el.value; render(); }
  else if (el.dataset.ch === "anneeIK") { S.anneeIK = el.value; render(); }
  else if (el.dataset.ch === "csv") {
    const file = el.files && el.files[0]; if (!file) return;
    let txt = await file.text();
    if (txt.includes("\uFFFD")) { // fichier en Windows-1252
      const buf = await file.arrayBuffer(); txt = new TextDecoder("windows-1252").decode(buf);
    }
    S.qonto = { brut: txt, nomFichier: file.name, mapping: {}, propositions: [], sel: [], choix: [] };
    calculerQonto(); render();
  }
  else if (el.dataset.scan != null) { const file = el.files && el.files[0]; el.value = ""; if (file) scannerTicket(file); }
  else if (el.dataset.pchk) {
    try {
      const k = el.dataset.pchk;
      if (k === "ocr") await sauverConfig({ ocr: Object.assign({}, S.config.ocr, { actif: el.checked }) });
      else await sauverConfig({ envoi: Object.assign({}, S.config.envoi, { [k]: el.checked }) });
      toast("Enregistré ✓");
    } catch (e) { toast(msgErreur(e), true); el.checked = !el.checked; }
  }
  else if (el.dataset.map) { S.qonto.mapping[el.dataset.map] = +el.value; calculerQonto(); render(); }
  else if (el.dataset.qsel != null) { S.qonto.sel[+el.dataset.qsel] = el.checked; render(); }
  else if (el.dataset.qchoix != null) {
    const i = +el.dataset.qchoix; S.qonto.choix[i] = el.value === "" ? null : +el.value;
    if (el.value !== "") S.qonto.sel[i] = true;
    render();
  }
});

document.addEventListener("submit", async ev => {
  const f = ev.target;
  if (!["f-login", "f-signup", "f-reset"].includes(f.id)) return;
  ev.preventDefault();
  const btn = f.querySelector("button"); btn.disabled = true;
  const email = f.email.value.trim().toLowerCase();
  try {
    if (f.id === "f-login") await auth.signInWithEmailAndPassword(email, f.pw.value);
    else if (f.id === "f-signup") {
      if (f.pw.value !== f.pw2.value) { authMsg("Les mots de passe ne correspondent pas."); btn.disabled = false; return; }
      const cred = await auth.createUserWithEmailAndPassword(email, f.pw.value);
      await cred.user.sendEmailVerification();
    } else {
      await auth.sendPasswordResetEmail(email);
      authMsg("Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé.", true);
    }
  } catch (e) { authMsg(esc(msgErreur(e))); }
  btn.disabled = false;
});

window.__NF_APP = { S, genererPDF, verifierVersion, MAJ }; // accès pour diagnostic
init();
})();
</script>
